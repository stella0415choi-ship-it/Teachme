<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teach Me! 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{
  --paper:#EAF0F7; --sheet:#FFFFFF; --ink:#1D2A4A; --ink-soft:#5A6684; --rule:#CBD7E7; --margin:#F1A3B0;
  --hl:#FFE45A; --hl-ink:#2C2400; --red:#D63A55; --mint:#178F72; --blue:#2F63D0; --amber:#B86A0C;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10172A; --sheet:#192340; --ink:#E6ECF6; --ink-soft:#A1AECA; --rule:#2C3A5E; --margin:#7A3F52;
    --hl:#F2D341; --hl-ink:#1E1800; --red:#FF6F86; --mint:#4FD3AF; --blue:#86A8FF; --amber:#F0A748;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10172A; --sheet:#192340; --ink:#E6ECF6; --ink-soft:#A1AECA; --rule:#2C3A5E; --margin:#7A3F52;
  --hl:#F2D341; --hl-ink:#1E1800; --red:#FF6F86; --mint:#4FD3AF; --blue:#86A8FF; --amber:#F0A748;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:0}
h2{font-size:22px;margin:0 0 6px;line-height:1.3}
h3{font-size:18px;margin:0 0 6px;line-height:1.3}
p{margin:0 0 10px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 0 10px}
.brand h1{font-size:30px;margin:0;line-height:1.1;white-space:nowrap}
.brand span{font-size:13px;color:var(--ink-soft);text-align:right}
.steps{display:flex;gap:4px;margin:0 0 16px;padding:0;list-style:none}
.steps li{flex:1;min-width:0;font-size:12px;text-align:center;padding:6px 0;border-bottom:3px solid var(--rule);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.steps li.done{border-color:var(--mint);color:var(--ink)}
.banner{background:var(--hl);color:var(--hl-ink);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:16px;padding:16px;margin:0 0 14px}
.muted{color:var(--ink-soft);font-size:14px}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.btn{font:inherit;font-size:15px;line-height:1.2;border-radius:12px;padding:12px 16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:7px 12px;font-size:14px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:12px;resize:vertical;margin:10px 0}
textarea:focus{border-color:var(--ink);outline:none}
/* outline screen */
.sec{border-top:1.5px dashed var(--rule);padding:10px 0}
.sec:first-of-type{border-top:none}
.sec-head{display:flex;align-items:center;gap:10px}
.sec-head input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.sec-title{flex:1;min-width:0;font-weight:700}
.goals{margin:6px 0 0 30px;padding:0;font-size:14px;color:var(--ink-soft)}
.goals li{margin:2px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opt{font:inherit;text-align:left;background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt-t{font-family:"Jua",sans-serif;font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.opt-d{font-size:13px;color:var(--ink-soft);line-height:1.45}
.rec{font-family:"Gowun Dodum",sans-serif;font-size:11px;background:var(--hl);color:var(--hl-ink);border-radius:99px;padding:1px 8px}
.reason{font-size:14px;background:var(--paper);border-radius:10px;padding:8px 10px}
/* visual novel scene: 하린 스탠딩 + 대사 상자 */
.scene{position:relative;height:clamp(300px,52vh,420px);border-radius:18px;overflow:hidden;border:1.5px solid var(--rule);
  background:linear-gradient(180deg,#F8DDD8 0%,#F2BFC2 55%,#E8A0AE 100%)}
.scene::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1.2px,transparent 1.3px);background-size:18px 18px;opacity:.7}
.scene.small{height:clamp(240px,38vh,320px)}
.sprite{position:absolute;left:50%;bottom:0;height:100%;width:auto;max-width:none;transform:translateX(-50%);transition:opacity .18s ease}
.sprite.fade{opacity:0}
.scene.talk .sprite{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translate(-50%,-4px)}}
@media (prefers-reduced-motion:reduce){.scene.talk .sprite{animation:none}.sprite{transition:none}}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.hud span{background:rgba(255,246,230,.88);color:#2E3A66;border:1.5px solid #2E3A66;border-radius:99px;padding:2px 10px;font-size:13px}
.hearts{letter-spacing:1px;color:#D25C78}
.dbox{position:relative;background:var(--sheet);border:2px solid var(--ink);border-radius:16px;padding:22px 16px 14px;margin:-58px 6px 14px;min-height:92px;font-size:17px;line-height:1.65;z-index:3;box-shadow:0 0 0 4px var(--paper)}
.reward-art{display:block;width:100%;border-radius:14px;margin-top:10px}
.dbox .plate{position:absolute;top:-15px;left:14px;background:var(--cc);color:#fff;font-family:"Jua",sans-serif;padding:3px 12px;border-radius:8px;font-size:15px}
.dbox.thinking .txt{color:var(--ink-soft)}
.dbox.err .txt{color:var(--red)}
.tabs{display:flex;border-bottom:1.5px solid var(--rule);margin:0 0 12px}
.tabs button{flex:1;font:inherit;font-size:15px;background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:10px 4px;color:var(--ink-soft);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--sheet);border-bottom-right-radius:4px}
.msg.ch{align-self:flex-start;background:var(--sheet);border:1.5px solid var(--rule);border-bottom-left-radius:4px}
.msg .ids{display:block;font-size:11px;opacity:.75;margin-top:4px}
.composer{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--paper);padding:8px 0;display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.composer textarea{margin:0;min-height:52px}
.composer .btn{flex:none}
.actions{margin-top:6px}
/* notebook */
.note{position:relative;background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);border:1.5px solid var(--rule);border-radius:12px;padding:0 12px 0 54px;line-height:32px;font-size:15px}
.note::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin)}
.ln{position:relative}
.ln .sid{position:absolute;left:-46px;width:36px;text-align:right;font-family:"Jua",sans-serif;font-weight:400;color:var(--ink-soft);font-size:14px}
.ln.cited span{background:linear-gradient(transparent 52%,var(--hl) 52%);color:var(--ink)}
.ln.cited .sid{color:var(--ink)}
.ln.empty span{color:var(--ink-soft)}
.mis-box{margin-top:16px}
.mis{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:12px;margin-top:8px;font-size:15px;background:var(--sheet)}
.mis .mid{font-family:"Jua",sans-serif;color:var(--ink-soft)}
.mst{grid-column:2;font-size:12px;justify-self:start;border-radius:99px;padding:1px 8px;border:1px solid var(--ink-soft);color:var(--ink-soft)}
.mst.open{border-color:var(--amber);color:var(--amber)}
/* runtime */
.rt{border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;font-size:14px;background:var(--sheet);margin-top:8px}
.rt .ly{font-family:"Jua",sans-serif;font-size:16px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;margin:4px 4px 0 0;border:1px solid}
.pill.see{border-color:var(--mint);color:var(--mint)}
.pill.no{border-color:var(--red);color:var(--red);text-decoration:line-through}
.gbar{padding:8px 0;border-bottom:1px dashed var(--rule)}
.gbar .gt{font-size:14px}
.segs{display:flex;gap:4px;margin-top:6px}
.segs i{flex:1;height:7px;border-radius:99px;background:var(--rule)}
.segs i.f{background:var(--mint)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 4px}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
/* exam */
.esteps{list-style:none;margin:0;padding:0}
.esteps li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--rule)}
.esteps .n{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:14px;color:var(--ink-soft)}
.esteps li.run .n{border-color:var(--ink);color:var(--ink);animation:pulse 1s ease-in-out infinite alternate}
.esteps li.done .n{border-color:var(--mint);background:var(--mint);color:var(--sheet)}
@keyframes pulse{to{box-shadow:0 0 0 5px var(--rule)}}
@media (prefers-reduced-motion:reduce){.esteps li.run .n{animation:none}}
.err-text{color:var(--red);font-size:14px;margin-top:10px}
/* review */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:"Jua",sans-serif;font-weight:400;font-size:40px;line-height:1}
.reward{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.reward span{font-size:13px;border-radius:99px;padding:3px 10px;background:var(--paper)}
.card{--tc:var(--blue);background:var(--sheet);border:1.5px solid var(--rule);border-left:6px solid var(--tc);border-radius:12px;padding:14px;margin-top:10px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--tc);color:var(--sheet);margin-bottom:6px}
.card h3{font-size:17px}
.kv{display:grid;grid-template-columns:5.6em 1fr;gap:6px 10px;font-size:14px;margin:8px 0 0}
.kv dt{color:var(--ink-soft)}
.kv dd{margin:0}
.good{margin:0;padding-left:20px;font-size:15px}
details.q{border-top:1px dashed var(--rule);padding:10px 0}
details.q summary{cursor:pointer;font-size:15px;list-style-position:outside}
.res{display:inline-block;font-size:12px;border-radius:99px;padding:0 8px;margin-left:6px;border:1px solid}
.res.correct{color:var(--mint);border-color:var(--mint)}
.res.partial{color:var(--amber);border-color:var(--amber)}
.res.wrong{color:var(--red);border-color:var(--red)}
.res.not_learned{color:var(--ink-soft);border-color:var(--ink-soft)}
.claim{font-size:14px;margin:6px 0 0;padding-left:10px;border-left:3px solid var(--mint)}
.claim.bad{border-color:var(--red);color:var(--ink-soft);text-decoration:line-through}
.cite{display:inline-block;font-size:11px;background:var(--hl);color:var(--hl-ink);border-radius:5px;padding:0 5px;margin-left:4px}
.qa{font-size:14px;margin:8px 0 0}
.qa b{font-weight:700}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,12,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mpanel{background:var(--sheet);width:100%;max-width:560px;max-height:82%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.reading{white-space:pre-wrap;font-size:15.5px;line-height:1.8;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 14px;border-radius:12px;font-size:14px;max-width:90%;z-index:60}
@media (min-width:700px){.wrap{padding-top:28px}}
</style>
</head>

function h(tag, attrs){
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);

  });
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c){
  if (c == null || c === false) return;

}

function resetTeach(){
  S.ledger = []; S.dialog = []; S.misc = []; S.goals = {}; S.turn = 0; S.wrap = false; S.exam = null; S.draft = '';
}
function selectedIds(){ return Object.keys(S.selected).filter(function(k){ return S.selected[k]; }); }
function goalsSel(){
  var ids = selectedIds();
  return S.analysis.goals.filter(function(g){ return ids.indexOf(g.section) >= 0; });
}
function examQs(){
  var ids = selectedIds();
  var qs = S.analysis.exam.filter(function(q){ return ids.indexOf(q.section) >= 0; });
  return qs.length ? qs : S.analysis.exam.slice();
}
function selectedSource(){
  var a = S.analysis;
  if (!a.sliceOk) return S.source;
  var ids = selectedIds();
  return a.sections.filter(function(s){ return ids.indexOf(s.id) >= 0; }).map(function(s){ return s.text; }).join('\n\n');
}
function openBeliefs(){
  return S.misc.filter(function(m){ return m.status === 'open'; })
    .map(function(m, i){ return {id:'B' + (i + 1), text:m.text, from:m.id}; });
}
function splitSentences(t){
  var out = [];
  t.replace(/\r/g, '').split(/\n+/).forEach(function(line){
    var m = line.match(/.+?(?:[.!?。…]+(?=\s|$)|$)/g) || [];
    m.forEach(function(s){ s = s.trim(); if (s) out.push(s); });
  });
  return out;
}
function fmtLedger(){ return S.ledger.length ? S.ledger.map(function(l){ return l.id + ': ' + l.text; }).join('\n') : '(아직 없음)'; }
function fmtDialog(n){
  var ch = CHARS[S.charId];
  return S.dialog.slice(-n).map(function(d){ return (d.role === 'user' ? '학습자' : ch.name) + ': ' + d.text; }).join('\n');
}
function fmtBeliefs(bs){ return bs.length ? bs.map(function(b){ return b.id + ': ' + b.text; }).join('\n') : '없음'; }
function addLog(e){
  e.t = Date.now(); S.logs.unshift(e); S.logs = S.logs.slice(0, 40);
  if (S.screen === 'teach' && S.tab === 'runtime' && els.panel) renderPanel();
}

/* ---------- normalizers ---------- */
function normAnalysis(r, text){
  r = r || {};
  var seen = {};
  var sections = arr(r.sections).map(function(s, i){
    var id = String(s.id || ('s' + (i + 1)));
    if (seen[id]) id = 's' + (i + 1) + '_' + i;
    seen[id] = 1;
    return {id:id, title:String(s.title || ('구간 ' + (i + 1))), start:String(s.start || '')};
  });
  var first = sections[0] ? sections[0].id : 's1';
  var goals = arr(r.goals).map(function(g, i){
    var sec = String(g.section || '');
    return {id:String(g.id || ('g' + (i + 1))), section:seen[sec] ? sec : first, text:String(g.text || '')};
  }).filter(function(g){ return g.text; });
  var exam = arr(r.exam).map(function(q, i){
    var sec = String(q.section || '');
    return {
      id:String(q.id || ('q' + (i + 1))), section:seen[sec] ? sec : first, goal:String(q.goal || ''),
      kind:q.kind === 'detail' ? 'detail' : 'flow', question:String(q.question || ''), answer:String(q.answer || ''),
      key_points:arr(q.key_points).map(String), detail_points:arr(q.detail_points).map(String)
    };
  }).filter(function(q){ return q.question; }).slice(0, 8);
  // cut the source into sections using the start markers
  var pos = sections.map(function(s){
    var st = s.start.trim(); if (!st) return -1;
    var i = text.indexOf(st);
    if (i < 0 && st.length > 8) i = text.indexOf(st.slice(0, 8));
    return i;
  });
  var sliceOk = sections.length > 0 && pos.every(function(p, k){ return p >= 0 && (k === 0 || p > pos[k - 1]); });
  sections.forEach(function(s, k){
    s.text = sliceOk ? text.slice(k === 0 ? 0 : pos[k], k + 1 < pos.length ? pos[k + 1] : text.length).trim() : '';
  });
  return {
    title:String(r.title || S.fileName || '학습 자료'),
    recommended_mode:r.recommended_mode === 'memorize' ? 'memorize' : 'flow',
    recommend_reason:String(r.recommend_reason || ''),
    sections:sections, goals:goals, exam:exam, sliceOk:sliceOk
  };
}
function normSolve(r, qs){
  var list = arr(r && r.answers);
  return qs.map(function(q){
    var a = list.filter(function(x){ return String(x.id) === q.id; })[0] || {};
    return {
      id:q.id, answer:String(a.answer || '그건 안 배워서 답을 못하겠어요...'),
      status:['answered','partial','not_learned'].indexOf(a.status) >= 0 ? a.status : 'not_learned',
      claims:arr(a.claims).map(function(c){ return {text:String(c.text || ''), basis:arr(c.basis).map(String)}; })
    };
  });
}
function mergeVerify(solved, r){
  var list = arr(r && r.results);
  return solved.map(function(s){
    var v = list.filter(function(x){ return String(x.id) === s.id; })[0] || {};
    var vc = arr(v.claims);
    var claims = s.claims.map(function(c, i){
      var bad = (vc[i] && vc[i].verdict === 'unsupported') || !c.basis.length;
      return {text:c.text, basis:c.basis, verdict:bad ? 'unsupported' : 'ok', reason:String((vc[i] && vc[i].reason) || '')};
    });
    var st = ['answered','partial','not_learned'].indexOf(v.status) >= 0 ? v.status : s.status;
    return {id:s.id, answer:s.answer, claims:claims, final:String(v.final_answer || s.answer), status:st};
  });
}
function normGrade(r, qs){
  r = r || {};
  var score = Math.max(0, Math.min(100, Math.round(Number(r.score) || 0)));
  var pq = {};
  arr(r.per_question).forEach(function(p){ if (RESULT[p.result]) pq[String(p.id)] = p.result; });
  return {
    score:score, summary:String(r.summary || ''), per:pq,
    cards:arr(r.cards).slice(0, 6).map(function(c){
      return {tag:TAGS[c.tag] ? c.tag : '설명 누락', title:String(c.title || ''), student:String(c.student || ''), missing:String(c.missing || ''), cause:String(c.cause || ''), section:String(c.section || '')};
    }),
    good:arr(r.good).map(String).filter(Boolean).slice(0, 3)
  };
}
function citedSet(){
  var set = {};
  if (S.exam && S.exam.finals) S.exam.finals.forEach(function(f){
    f.claims.forEach(function(c){ if (c.verdict === 'ok') c.basis.forEach(function(b){ set[b] = 1; }); });
  });
  return set;
}

/* ---------- actions ---------- */
function onFile(file, ta, upd){
  if (!file) return;
  S.fileName = file.name;
  var isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
  var job;
  if (isPdf) {
    if (!window.pdfjsLib) { toast('PDF 읽기 도구가 아직 준비되지 않았어요. 잠시 후 다시 올려 주세요.'); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    job = file.arrayBuffer().then(function(buf){ return window.pdfjsLib.getDocument({data:buf}).promise; }).then(function(pdf){
      var n = Math.min(pdf.numPages, 40), out = [], chain = Promise.resolve();
      for (var i = 1; i <= n; i++) (function(p){
        chain = chain.then(function(){ return pdf.getPage(p); }).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
          out.push(tc.items.map(function(it){ return it.str + (it.hasEOL ? '\n' : ' '); }).join(''));
        });
      })(i);
      return chain.then(function(){ return out.join('\n\n'); });
    });
  } else {
    job = file.text();
  }
  job.then(function(text){
    text = text.replace(/[ \t]{2,}/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    if (text.length < 40) throw new Error('empty');
    S.source = text; ta.value = text; upd();
    toast(file.name + '에서 글자를 읽었어요.');
  }).catch(function(){
    toast('파일에서 글자를 읽지 못했어요. 스캔한 PDF라면 내용을 복사해 붙여넣어 주세요.');
  });
}

function analyze(btn, status){
  var text = S.source.trim();
  if (text.length < 80) { status.textContent = '자료가 너무 짧아요. 한 문단 이상 넣어 주세요.'; return; }
  btn.disabled = true;
  status.textContent = '자료를 읽고 목차와 시험 문제를 만드는 중이에요. 30초에서 1분쯤 걸려요.';
  addLog({layer:'자료 분석 계층', tier:'default', sees:['원문 전체'], blocked:[], note:'목차, 학습 목표, 시험 문제를 만들고 보관해요.'});
  AI.json(P.analyze(text.slice(0, 30000)), {modelTier:'default', cache:{gcTime:3600000}}).then(function(raw){
    var a = normAnalysis(raw, text);
    if (!a.sections.length || !a.exam.length) throw {code:'invalid_json'};
    S.analysis = a; S.selected = {};
    a.sections.forEach(function(s){ S.selected[s.id] = true; });
    S.mode = a.recommended_mode;
    resetTeach(); go('outline');
  }).catch(function(e){
    status.textContent = errMsg(e) || '중단됐어요.';
    btn.disabled = false;
  });
}

function startTeach(){
  resetTeach();
  S.dialog.push({role:'char', text:CHARS[S.charId].hello});
  S.face = 'fighting';
  S.tab = 'talk';
  go('teach');
}

function applyTracker(r){
  r = r || {};
  arr(r.goals).forEach(function(g){
    var lv = Math.max(0, Math.min(3, parseInt(g.level, 10) || 0));
    if (g.id) S.goals[String(g.id)] = {level:lv, note:String(g.note || '')};
  });
  arr(r.misconception_updates).forEach(function(u){
    var m = S.misc.filter(function(x){ return x.id === String(u.id); })[0];
    if (m && m.status === 'open' && (u.status === 'corrected' || u.status === 'wrongly_corrected')) m.status = u.status;
  });
  var d = r.directive || {};
  return {
    kind:KIND[d.kind] ? d.kind : 'ask', goal:String(d.goal || ''), focus:String(d.focus || ''),
    misconception:String(d.misconception || ''), based_on:arr(d.based_on).map(String)
  };
}

function setLine(text, thinking){
  if (!els.dtext) return;
  els.dbox.classList.toggle('thinking', !!thinking);
  els.dbox.classList.remove('err');
  els.dtext.textContent = text;
}

function send(){
  if (S.busy) return;
  var msg = els.input.value.trim();
  if (!msg) return;
  var ch = CHARS[S.charId];
  S.busy = true; els.send.disabled = true; els.input.value = ''; S.draft = '';
  S.turn++;
  var ids = [];
  splitSentences(msg).forEach(function(t){
    var id = 'S' + (S.ledger.length + 1);
    S.ledger.push({id:id, text:t, turn:S.turn}); ids.push(id);
  });
  S.dialog.push({role:'user', text:msg, ids:ids});
  renderPanel();
  setLine('생각하는 중…', true);
  setFace('neutral');
  var d, mis = null;
  AI.json(P.tracker(), {modelTier:'quick', cache:false}).then(function(raw){
    d = applyTracker(raw);
    if (d.kind === 'misconception') {
      var canMis = d.misconception && S.turn > 1 && S.misc.length < 3 && !S.misc.some(function(m){ return m.status === 'open'; });
      if (canMis) mis = {id:'M' + (S.misc.length + 1), text:d.misconception, based_on:d.based_on, status:'open', turn:S.turn};
      else d.kind = 'ask';
    }
    S.wrap = d.kind === 'wrap';
    addLog({layer:'이해 상태 추적기', tier:'quick', sees:['원문(선택 범위)','학습 목표','학습자 문장','대화'], blocked:[],
      note:'목표별 이해 수준을 판정하고 다음 질문 방향만 정해요.', detail:'지시: ' + KIND[d.kind] + (d.kind === 'misconception' && mis ? ' / ' + mis.text : (d.focus ? ' / ' + d.focus : ''))});
    addLog({layer:'후배 캐릭터 · ' + ch.short, tier:'quick', sees:['학습자 문장 ' + S.ledger.length + '개','대화 기록','이번 턴 지시'], blocked:['원문','정답','시험 문제'],
      note:'지시 범위 안에서 대사만 만들어요.'});
    setLine('', false);
    S.face = FACE_BY_KIND[d.kind] || 'think';
    setFace(S.face);
    els.scene.classList.add('talk');
    return AI.text(P.character(d, mis), {modelTier:'quick', cache:false, onText:function(u){ setLine(u.text, false); }});
  }).then(function(res){
    var line = res.text.trim();
    if (mis) S.misc.push(mis);
    S.dialog.push({role:'char', text:line, kind:d.kind, mis:mis ? mis.id : null});
    setLine(line, false);
    els.exam.className = 'btn small' + (S.wrap ? '' : ' ghost');
  }).catch(function(e){
    setLine(errMsg(e) || '중단됐어요. 다시 보내 주세요.', false);
    els.dbox.classList.add('err');
  }).then(function(){
    S.busy = false; els.send.disabled = false; els.scene.classList.remove('talk');
    renderPanel();
  });
}

function runExam(retry){
  if (!retry) {
    if (!S.ledger.length) { toast('먼저 한 문장이라도 설명해 주세요.'); return; }
    S.exam = {qs:examQs(), beliefs:openBeliefs(), stage:0, err:''};
  }
  var E = S.exam; E.err = '';
  go('exam');
  var p = Promise.resolve();
  if (E.stage <= 0) p = p.then(function(){
    addLog({layer:'후배 캐릭터 · 시험', tier:'default', sees:['학습자 문장 ' + S.ledger.length + '개','믿게 된 추론 ' + E.beliefs.length + '개','시험 문제(질문만)'], blocked:['원문','모범답안'], note:'공책만 보고 풀고, 주장마다 근거 번호를 붙여요.'});
    return AI.json(P.solve(E.beliefs, E.qs), {modelTier:'default', cache:false}).then(function(r){ E.solved = normSolve(r, E.qs); E.stage = 1; renderAll(); });
  });
  p = p.then(function(){
    if (E.stage > 1) return;
    addLog({layer:'근거 검증기', tier:'quick', sees:['학습자 문장','후배 답안과 근거 번호'], blocked:['원문','모범답안'], note:'근거 없는 주장은 지우고 안 배운 걸로 바꿔요.'});
    return AI.json(P.verify(E.beliefs, E.solved), {modelTier:'quick', cache:false}).then(function(r){ E.finals = mergeVerify(E.solved, r); E.stage = 2; renderAll(); });
  });
  p = p.then(function(){
    if (E.stage > 2) return;
    addLog({layer:'채점·되짚기 계층', tier:'default', sees:['원문','모범답안','학습자 문장','후배 최종 답안'], blocked:[], note:'원인을 세 가지로 나눠 되짚기 카드를 만들어요.'});
    return AI.json(P.grade(E.beliefs, E.qs, E.finals), {modelTier:'default', cache:false}).then(function(r){ E.grade = normGrade(r, E.qs); E.stage = 3; });
  });
  p.then(function(){
    var g = E.grade;
    E.affGain = Math.round(g.score / 10); E.coinGain = g.score;
    S.affinity = Math.min(100, S.affinity + E.affGain); S.coins += E.coinGain;
    go('review');
  }).catch(function(e){
    E.err = errMsg(e) || '중단됐어요.';
    renderAll();
  });
}

  S.screen = screen; renderAll();
  window.scrollTo({top:0, behavior:reduced() ? 'auto' : 'smooth'});
}

      h('div', {class:'row spread'}, count, btn),
      status),
    h('p', {class:'muted small'}, '프로토타입이라 웹 주소로 자료 등록하기는 아직 빠져 있어요. 스캔한 PDF는 글자를 못 읽으니 내용을 붙여넣어 주세요.')
  );
}

function openReader(secId){
  var a = S.analysis;
  var s = a.sections.filter(function(x){ return x.id === secId; })[0];
  var title = s ? s.title : '전체 자료';
  var body = (s && a.sliceOk && s.text) ? s.text : S.source;
  var prev = document.activeElement, m;
  function close(){ m.remove(); document.removeEventListener('keydown', esc); if (prev && prev.focus) prev.focus(); }
  function esc(e){ if (e.key === 'Escape') close(); }
  var closeBtn = h('button', {class:'btn ghost small', onclick:close}, '닫기');
  m = h('div', {class:'modal', onclick:function(e){ if (e.target === m) close(); }},
    h('div', {class:'mpanel', role:'dialog', 'aria-modal':'true', 'aria-label':title},
      h('div', {class:'row spread'}, h('h3', {style:'margin:0'}, title), closeBtn),
      s && !a.sliceOk ? h('p', {class:'muted small', style:'margin-top:8px'}, '구간을 정확히 나누지 못해 전체 자료를 보여 줘요.') : null,
      h('div', {class:'reading'}, body)));
  document.body.append(m);
  document.addEventListener('keydown', esc);
  closeBtn.focus();
}

function viewOutline(){
  var a = S.analysis;
  var countEl = h('p', {class:'muted', style:'margin:10px 0 0'});
  var startBtn = h('button', {class:'btn', onclick:startTeach}, '가르치기 시작');
  function refresh(){
    countEl.textContent = '선택한 범위: 학습 목표 ' + goalsSel().length + '개, 시험 문제 ' + examQs().length + '개';
    startBtn.disabled = !selectedIds().length;
  }
  var secs = a.sections.map(function(s, i){
    var cb = h('input', {type:'checkbox', id:'cb-' + s.id});
    cb.checked = !!S.selected[s.id];
    cb.addEventListener('change', function(){ S.selected[s.id] = cb.checked; refresh(); });
    var gs = a.goals.filter(function(g){ return g.section === s.id; });
    return h('div', {class:'sec'},
      h('div', {class:'sec-head'}, cb, h('label', {for:'cb-' + s.id, class:'sec-title'}, (i + 1) + '. ' + s.title),
        h('button', {class:'btn ghost small', onclick:function(){ openReader(s.id); }}, '읽기')),
      gs.length ? h('ul', {class:'goals'}, gs.map(function(g){ return h('li', {}, g.text); })) : null);
  });
  var modes = h('div', {class:'opts', role:'radiogroup', 'aria-label':'학습 목표'}, ['flow','memorize'].map(function(m){
    return h('button', {class:'opt' + (S.mode === m ? ' on' : ''), role:'radio', 'aria-checked':String(S.mode === m), onclick:function(){ S.mode = m; renderAll(); }},
      h('span', {class:'opt-t'}, MODES[m].label, a.recommended_mode === m ? h('span', {class:'rec'}, 'AI 추천') : null),
      h('span', {class:'opt-d'}, MODES[m].desc));
  }));
  refresh();
  return h('section', {},
    h('div', {class:'sheet'},
      h('div', {class:'row spread'}, h('h2', {style:'margin:0'}, a.title), h('button', {class:'btn ghost small', onclick:function(){ openReader(null); }}, '공부 모드')),
      h('p', {class:'muted', style:'margin-top:6px'}, '가르칠 범위를 고르세요. 읽기를 누르면 그 구간 자료를 다시 볼 수 있어요.'),
      secs, countEl),
    h('div', {class:'sheet'},
      h('h3', {}, '이번 목표는?'),
      modes,
      a.recommend_reason ? h('p', {class:'reason'}, a.recommend_reason) : null),
    h('div', {class:'row spread'}, h('button', {class:'btn ghost small', onclick:function(){ go('upload'); }}, '자료 다시 올리기'), startBtn)
  );
}

function viewTeach(){
  var ch = CHARS[S.charId];
  var last = S.dialog.slice().reverse().filter(function(d){ return d.role === 'char'; })[0];
  els.scene = scene(S.face);
  els.dtext = h('div', {class:'txt', 'aria-live':'polite'}, last ? last.text : '');
  els.dbox = h('div', {class:'dbox', style:'--cc:' + ch.color}, h('span', {class:'plate'}, ch.name), els.dtext);
  var stage = h('div', {}, els.scene,
    h('p', {class:'muted small', style:'margin:6px 2px 0;text-align:right'}, MODES[S.mode].label + ' 목표'));
  var tabDefs = [['talk','대화'],['note',ch.short + '의 공책'],['runtime','런타임']];
  var tabs = h('div', {class:'tabs', role:'tablist'}, tabDefs.map(function(t){
    return h('button', {role:'tab', 'aria-selected':String(S.tab === t[0]), onclick:function(){
      S.tab = t[0];
      Array.prototype.forEach.call(tabs.children, function(b, i){ b.setAttribute('aria-selected', String(tabDefs[i][0] === S.tab)); });
      renderPanel();
    }}, t[1]);
  }));
  els.panel = h('div', {role:'tabpanel'});
  els.input = h('textarea', {rows:2, placeholder:ch.short + '에게 설명해 보세요', 'aria-label':'설명 입력'});
  els.input.value = S.draft;
  els.input.addEventListener('input', function(){ S.draft = els.input.value; });
  els.input.addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } });
  els.send = h('button', {class:'btn', onclick:send}, '보내기');
  els.send.disabled = S.busy;
  els.exam = h('button', {class:'btn small' + (S.wrap ? '' : ' ghost'), onclick:function(){ runExam(false); }}, '수업 끝내고 시험 보기');
  renderPanel();
  return h('section', {}, stage, els.dbox, tabs, els.panel,
    h('div', {class:'composer'}, els.input, els.send),
    h('div', {class:'row spread actions'}, h('button', {class:'btn ghost small', onclick:function(){ go('outline'); }}, '목차로'), els.exam));
}

function renderPanel(){
  if (!els.panel) return;
  els.panel.innerHTML = '';
  if (S.tab === 'talk') els.panel.append(viewChat());
  else if (S.tab === 'note') els.panel.append(viewNote());
  else els.panel.append(viewRuntime());
}

function viewChat(){
  return h('div', {class:'chat'}, S.dialog.map(function(d){
    if (d.role === 'user') return h('div', {class:'msg me'}, d.text,
      d.ids && d.ids.length ? h('span', {class:'ids'}, '공책에 ' + (d.ids.length > 1 ? d.ids[0] + '~' + d.ids[d.ids.length - 1] : d.ids[0]) + '로 적힘') : null);
    return h('div', {class:'msg ch'}, d.text);
  }));
}

function viewNote(){
  var ch = CHARS[S.charId], cited = citedSet();
  var lines = S.ledger.length ? S.ledger.map(function(l){
    return h('div', {class:'ln' + (cited[l.id] ? ' cited' : '')}, h('b', {class:'sid'}, l.id), h('span', {}, l.text));
  }) : [h('div', {class:'ln empty'}, h('span', {}, '아직 비어 있어요. 설명한 문장이 여기 적혀요.'))];
  return h('div', {},
    h('p', {class:'muted'}, ch.short + '는 이 공책에 적힌 것만 알아요. 시험도 이 공책만 보고 풀어요.' + (S.exam && S.exam.finals ? ' 형광펜은 시험에서 근거로 쓰인 문장이에요.' : '')),
    h('div', {class:'note'}, lines),
    S.misc.length ? h('div', {class:'mis-box'},
      h('h3', {}, ch.short + '가 혼자 추론한 것'),
      h('p', {class:'muted'}, '맞는지 틀린지는 시험이 끝나면 알려 줘요. 답하지 않고 넘어가면 이대로 믿고 시험을 봐요.'),
      S.misc.map(function(m){
        return h('div', {class:'mis'}, h('span', {class:'mid'}, m.id), h('span', {}, m.text),
          h('span', {class:'mst' + (m.status === 'open' ? ' open' : '')}, m.status === 'open' ? '확인 필요' : '답변 반영됨'));
      })) : null);
}

function viewRuntime(){
  var gs = S.analysis ? goalsSel() : [];
  var dev = h('input', {type:'checkbox', id:'devt'});
  dev.checked = S.dev;
  dev.addEventListener('change', function(){ S.dev = dev.checked; renderPanel(); });
  return h('div', {},
    h('p', {class:'muted'}, '심사·개발용 화면이에요. 계층마다 무엇을 보고 무엇이 차단됐는지 기록돼요.'),
    h('label', {class:'toggle', for:'devt'}, dev, '개발자 보기 (켜면 질문 의도가 보여서 공부 효과가 줄어요)'),
    h('h3', {style:'margin-top:12px'}, '목표별 이해 상태'),
    gs.map(function(g){
      var st = S.goals[g.id] || {level:0, note:''};
      return h('div', {class:'gbar'}, h('div', {class:'gt'}, g.text),
        h('div', {class:'segs', role:'img', 'aria-label':LEVELS[st.level]}, [0,1,2].map(function(i){ return h('i', {class:i < st.level ? 'f' : ''}); })),
        h('div', {class:'muted small'}, LEVELS[st.level] + (S.dev && st.note ? ', ' + st.note : '')));
    }),
    h('h3', {style:'margin-top:16px'}, '호출 기록'),
    S.logs.length ? S.logs.map(function(l){
      return h('div', {class:'rt'},
        h('div', {class:'row spread'}, h('span', {class:'ly'}, l.layer), h('span', {class:'muted small'}, l.tier + ' 모델')),
        h('div', {}, l.sees.map(function(x){ return h('span', {class:'pill see'}, x); }), l.blocked.map(function(x){ return h('span', {class:'pill no'}, x); })),
        h('div', {class:'muted small', style:'margin-top:4px'}, l.note),
        S.dev && l.detail ? h('div', {class:'small', style:'margin-top:4px'}, l.detail) : null);
    }) : h('p', {class:'muted'}, '아직 호출이 없어요.'));
}

function viewExam(){
  var E = S.exam, ch = CHARS[S.charId];
  var stepsDef = [
    [ch.short + '가 공책만 보고 시험 푸는 중', '원문과 모범답안은 받지 않아요. 주장마다 근거 번호를 붙여요.'],
    ['근거 검증기가 근거 번호 확인하는 중', '근거가 없는 주장은 지우고, 안 배운 걸로 바꿔요.'],
    ['채점하고 되짚기 카드 만드는 중', MODES[S.mode].label + ' 기준으로 채점해요.']
  ];
  return h('section', {},
    scene('reading', true),
    h('div', {class:'dbox', style:'--cc:' + ch.color}, h('span', {class:'plate'}, ch.name), h('div', {class:'txt'}, '선배가 알려준 것만 보고 풀어 볼게요… 으음.')),
    h('div', {class:'sheet'},
      h('h2', {}, '시험 보는 중'),
      h('p', {class:'muted'}, ch.short + '가 아는 것: 학습자 문장 ' + S.ledger.length + '개, 혼자 믿게 된 추론 ' + E.beliefs.length + '개, 시험 문제 ' + E.qs.length + '개'),
      h('ol', {class:'esteps'}, stepsDef.map(function(s, i){
        var cls = i < E.stage ? 'done' : (i === E.stage && !E.err ? 'run' : '');
        return h('li', {class:cls}, h('span', {class:'n', 'aria-hidden':'true'}, i < E.stage ? '✓' : String(i + 1)),
          h('div', {}, h('div', {}, s[0]), h('div', {class:'muted small'}, s[1])));
      })),
      E.err ? h('div', {}, h('p', {class:'err-text'}, E.err), h('button', {class:'btn small', onclick:function(){ runExam(true); }}, '이어서 다시 시도')) : null),
    h('button', {class:'btn ghost small', onclick:function(){ go('teach'); }}, '가르치기로 돌아가기'));
}

function viewReview(){
  var E = S.exam, G = E.grade, ch = CHARS[S.charId], a = S.analysis;
  var react = G.score >= 80 ? '선배 덕분에 거의 다 풀었어요! 머릿속에서 연결이 잘 돼요.'
    : G.score >= 50 ? '으음… 큰 흐름은 알겠는데 몇 문제는 헷갈렸어요. 틀린 부분 같이 봐 주실래요?'
    : '죄송해요 선배… 배운 게 부족해서 많이 못 풀었어요. 다시 알려 주세요!';
  var face = G.score >= 80 ? 'happy' : G.score >= 50 ? 'reading' : 'panic';
  var secTitle = function(id){ var s = a.sections.filter(function(x){ return x.id === id; })[0]; return s ? s.title : ''; };
  var cards = G.cards.map(function(c){
    var st = secTitle(c.section);
    return h('div', {class:'card', style:'--tc:' + TAGS[c.tag]},
      h('span', {class:'chip'}, c.tag + (c.tag === '참고' ? ' (감점 없음)' : '')),
      h('h3', {}, c.title),
      h('dl', {class:'kv'},
        c.student ? [h('dt', {}, '후배 답'), h('dd', {}, c.student)] : null,
        c.missing ? [h('dt', {}, '빠진 것'), h('dd', {}, c.missing)] : null,
        c.cause ? [h('dt', {}, '원인'), h('dd', {}, c.cause)] : null,
        st ? [h('dt', {}, '다시 볼 곳'), h('dd', {}, h('button', {class:'btn ghost small', onclick:function(){ openReader(c.section); }}, st + ' 읽기'))] : null));
  });
  var qs = E.qs.map(function(q){
    var f = E.finals.filter(function(x){ return x.id === q.id; })[0] || {final:'', claims:[]};
    var res = G.per[q.id] || (f.status === 'not_learned' ? 'not_learned' : 'partial');
    return h('details', {class:'q'},
      h('summary', {}, q.question, h('span', {class:'res ' + res}, RESULT[res])),
      h('p', {class:'qa'}, h('b', {}, ch.short + ' 최종 답: '), f.final),
      f.claims.map(function(c){
        return h('div', {class:'claim' + (c.verdict === 'ok' ? '' : ' bad'), title:c.reason || null}, c.text,
          c.basis.map(function(b){ return h('span', {class:'cite'}, b); }),
          c.verdict === 'ok' ? null : h('span', {class:'muted small'}, ' 근거 없음, 삭제'));
      }),
      h('p', {class:'qa'}, h('b', {}, '모범답안: '), q.answer));
  });
  return h('section', {},
    scene(face, true),
    h('div', {class:'dbox', style:'--cc:' + ch.color}, h('span', {class:'plate'}, ch.name), h('div', {class:'txt'}, react)),
    h('div', {class:'sheet'},
      h('div', {class:'score'}, h('b', {}, G.score + '점'), h('span', {class:'muted'}, MODES[S.mode].label + ' 기준')),
      G.summary ? h('p', {style:'margin-top:8px'}, G.summary) : null,
      h('p', {class:'muted small'}, S.mode === 'flow' ? '흐름 이해가 목표라서 연도나 세부 명칭만 빠진 건 감점하지 않았어요.' : '완벽 암기가 목표라서 세부 사항까지 채점했어요.'),
      h('div', {class:'reward'}, h('span', {}, '호감도 +' + E.affGain), h('span', {}, '코인 +' + E.coinGain + ' (보유 ' + S.coins + ')')),
      G.score >= 80 && SPRITES.cafe ? [
        h('img', {class:'reward-art', src:SPRITES.cafe, alt:'카페에서 딸기 파르페를 먹는 하린'}),
        h('p', {class:'muted small', style:'margin-top:6px'}, '80점 넘으면 받는 보상 일러스트예요. 하린이가 시험 끝나고 파르페 먹으러 갔대요.')] : null),
    h('h2', {style:'margin:18px 0 0'}, '되짚기'),
    cards.length ? cards : h('p', {class:'muted'}, '되짚을 구멍이 없어요. 완벽하게 가르쳤어요!'),
    G.good.length ? h('div', {class:'sheet', style:'margin-top:14px'}, h('h3', {}, '잘 가르친 점'), h('ul', {class:'good'}, G.good.map(function(g){ return h('li', {}, g); }))) : null,
    h('div', {class:'sheet', style:'margin-top:14px'}, h('h3', {}, '문제별 답안과 근거'), h('p', {class:'muted small'}, '형광펜 번호는 후배가 근거로 쓴 공책 문장이에요. 줄 그어진 주장은 검증기가 지운 거예요.'), qs),
    h('div', {class:'row spread'},
      h('button', {class:'btn ghost small', onclick:function(){ go('outline'); }}, '범위 다시 고르기'),
      h('button', {class:'btn', onclick:function(){ S.tab = 'talk'; S.dialog.push({role:'char', text:react}); S.face = face === 'happy' ? 'happy' : 'fighting'; go('teach'); }}, '이어서 다시 가르치기'))
  );
}

renderAll();
})();
</script>
</body>
</html>
